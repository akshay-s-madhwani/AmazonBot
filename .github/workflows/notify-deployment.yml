name: Deploy bot to machines
on:
  workflow_run:
    workflows: [Build bot]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to deploy to the configured machines (leave empty for main)'
        required: false
        type: string
permissions:
  contents: read
  actions: read
  pull-requests: read
  deployments: write
concurrency:
  group: notify-bot-deployment
  cancel-in-progress: false
jobs:
  notify:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Select successful build of main or the requested PR
        id: release
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const requested = (process.env.PR_NUMBER || '').trim();
            let sha, branch, prNumber;
            if (requested) {
              if (context.eventName !== 'workflow_dispatch' || !/^[1-9][0-9]*$/.test(requested)) {
                throw new Error('Enter a positive PR number, or leave it empty for main.');
              }
              prNumber = Number(requested);
              const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
              if (pr.state !== 'open' || pr.base.ref !== 'main' || pr.head.repo?.full_name !== `${owner}/${repo}`) {
                throw new Error('Only open PRs from this repository targeting main can deploy.');
              }
              sha = pr.head.sha;
              branch = pr.head.ref;
            } else {
              const { data: main } = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
              sha = main.commit.sha;
              branch = 'main';
            }
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: 'deploy.yml', branch,
              status: 'success', head_sha: sha, per_page: 100,
            });
            const run = data.workflow_runs.find(run => prNumber ? run.event === 'pull_request' :
              ['push', 'workflow_dispatch'].includes(run.event));
            if (!run) {
              const message = `No successful build for ${prNumber ? `PR #${prNumber}` : 'main'} at ${sha}. Run or rerun Build bot first.`;
              if (context.eventName === 'schedule') { core.notice(message); return; }
              throw new Error(message);
            }
            const { data: artifacts } = await github.rest.actions.listWorkflowRunArtifacts({ owner, repo, run_id: run.id, per_page: 100 });
            if (!artifacts.artifacts.some(a => a.name === `bot-${sha}-${run.run_attempt}` && !a.expired)) {
              throw new Error('Build has no deployable artifact. Rerun Build bot with the updated workflow.');
            }
            core.setOutput('payload', JSON.stringify({ repository: `${owner}/${repo}`, sha, runId: run.id, attempt: run.run_attempt,
              ...(prNumber ? { prNumber } : {}) }));
            core.setOutput('sha', sha);
            await core.summary.addHeading('Deployment selected').addRaw(`${prNumber ? `PR #${prNumber}` : 'main'} at ${sha}`).write();
      - name: Register deployment in GitHub
        if: steps.release.outputs.payload != ''
        id: deployment
        uses: actions/github-script@v7
        env:
          DEPLOY_SHA: ${{ steps.release.outputs.sha }}
        with:
          script: |
            const { data } = await github.rest.repos.createDeployment({ ...context.repo,
              ref: process.env.DEPLOY_SHA, environment: 'rdp-fleet', auto_merge: false,
              required_contexts: [], description: 'Deploy verified bot build to configured RDP machines' });
            if (!data.id) throw new Error('GitHub did not create a deployment');
            core.setOutput('id', String(data.id));
            await github.rest.repos.createDeploymentStatus({ ...context.repo, deployment_id: data.id, state: 'in_progress' });
      - name: Notify machines and wait for deployment results
        if: steps.release.outputs.payload != ''
        id: notify
        env:
          DEPLOY_RELEASE: ${{ steps.release.outputs.payload }}
          DEPLOY_TARGETS: ${{ secrets.DEPLOY_TARGETS }}
        run: node scripts/notify-deployment.mjs
      - name: Record deployment result
        if: always() && steps.deployment.outputs.id != ''
        uses: actions/github-script@v7
        env:
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.id }}
          DEPLOY_OUTCOME: ${{ steps.notify.outcome }}
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({ ...context.repo,
              deployment_id: Number(process.env.DEPLOYMENT_ID),
              state: process.env.DEPLOY_OUTCOME === 'success' ? 'success' : 'failure',
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}` });
